name: CI & RAG Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests with Pytest
        env:
          OPENAI_API_KEY: "mock-key-for-unit-tests"
          COHERE_API_KEY: "mock-key-for-unit-tests"
        run: |
          pytest -v tests/test_*.py

  ragas-evaluation-gate:
    name: Ragas Faithfulness Evaluation Gate
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    if: env.OPENAI_API_KEY != ''
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      RAGAS_FAITHFULNESS_THRESHOLD: 0.80

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Sample Corpus
        run: |
          python main.py ingest --dir data/sample_docs

      - name: Execute Offline Evaluation Gate
        run: |
          python src/evaluation/evaluate.py
